name: Electron macOS package

# Unsigned, un-notarized Apple Silicon development build (6.9.5 owns signing/DMG).
on:
  workflow_dispatch:
  push:
    tags: ['macos-v*']

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 120
    defaults:
      run:
        shell: bash scripts/ci-step.sh {0}
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      PG_VERSION: '17.11'
      PG_SHA256: dd27f2b3c59e73ed14aa3324901242bf69a032a6347805f274e6260322d42979
      WEED_VERSION: '4.47'
      WEED_MD5: 1a005a70ed013b3503a54b7c7833423f
      OLLAMA_VERSION: '0.33.3'
      OLLAMA_SHA256: 342db03df80bb9db84ff64246031bd5f70c09b59ff52fa5cc9aaae3476cc4a9d
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.17'
          python-version: '3.12'
      - name: Install locked dependencies
        run: |
          bun install --frozen-lockfile --ignore-scripts
          uv venv --python 3.12
          uv pip sync apps/api/requirements-windows.lock apps/api/requirements-dev.lock
      - name: Shared checks
        run: |
          bun run test
          bun run test:desktop
          PYTHONPATH=apps/api uv run --no-project python -m pytest apps/api/tests/test_runtime_platform.py apps/api/tests/test_windows_host.py -q
      - name: Build frozen service and web component
        run: |
          bun run build:macos-service
          bun run prepare:desktop-web
      - name: Build and verify native components
        run: |
          set -euo pipefail
          C="$RUNNER_TEMP/nt-components"; mkdir -p "$C"; cd "$RUNNER_TEMP"
          # PostgreSQL 17 from source (publisher SHA-256). A prefix without "postgres"/"pgsql"
          # yields share/postgresql; system zlib only, so nothing else needs relocation.
          curl -fsSLO "https://ftp.postgresql.org/pub/source/v$PG_VERSION/postgresql-$PG_VERSION.tar.bz2"
          echo "$PG_SHA256  postgresql-$PG_VERSION.tar.bz2" | shasum -a 256 -c
          tar xf "postgresql-$PG_VERSION.tar.bz2"
          PREFIX="$RUNNER_TEMP/nt-pg-root"
          (cd "postgresql-$PG_VERSION" && ./configure --prefix="$PREFIX" --without-icu --without-readline --without-openssl >/dev/null \
            && make -j"$(sysctl -n hw.ncpu)" >/dev/null && make install >/dev/null)
          rm -rf "$PREFIX/include" "$PREFIX/lib/pkgconfig" "$PREFIX"/lib/*.a
          for f in $(find "$PREFIX/bin" "$PREFIX/lib" -type f); do
            file -b "$f" | grep -q Mach-O || continue
            dir="$(dirname "${f#$PREFIX/}")"; up="$(echo "$dir" | sed -E 's#[^/]+#..#g')"
            case "$f" in *.dylib) [ "$dir" = lib ] && install_name_tool -id "@rpath/$(basename "$f")" "$f";; esac
            for dep in $(otool -L "$f" | awk 'NR>1{print $1}' | grep "^$PREFIX/" || true); do
              install_name_tool -change "$dep" "@loader_path/$up/${dep#$PREFIX/}" "$f"
            done
            codesign --force --sign - "$f"
          done
          cp "postgresql-$PG_VERSION/COPYRIGHT" "$PREFIX/COPYRIGHT"
          mv "$PREFIX" "$C/postgres"
          # SeaweedFS (publisher MD5 is the only checksum it publishes).
          curl -fsSL -o weed.tgz "https://github.com/seaweedfs/seaweedfs/releases/download/$WEED_VERSION/darwin_arm64.tar.gz"
          [ "$(md5 -q weed.tgz)" = "$WEED_MD5" ]
          mkdir "$C/seaweed"; tar xzf weed.tgz -C "$C/seaweed"
          cp "$GITHUB_WORKSPACE/apps/desktop/third-party/native/SEAWEEDFS-LICENSE" "$C/seaweed/LICENSE"
          # Ollama CLI/runtime only; no models.
          curl -fsSL -o ollama.tgz "https://github.com/ollama/ollama/releases/download/v$OLLAMA_VERSION/ollama-darwin.tgz"
          echo "$OLLAMA_SHA256  ollama.tgz" | shasum -a 256 -c
          mkdir "$C/ollama"; tar xzf ollama.tgz -C "$C/ollama"
          # The archive also carries Intel-only libraries; the dependency audit still fails if arm64 code needs one.
          find "$C/ollama" -type f | while read -r f; do
            if file -b "$f" | grep -q Mach-O && ! lipo -archs "$f" | grep -qw arm64; then echo "Dropping Intel-only ${f#$C/}"; rm "$f"; fi
          done
          find -L "$C/ollama" -type l -delete
          cp "$GITHUB_WORKSPACE/apps/desktop/third-party/native/OLLAMA-LICENSE" "$C/ollama/LICENSE"
          # Pinned Codex helper from the frozen Bun lock.
          cp -R "$GITHUB_WORKSPACE/node_modules/@openai/codex-darwin-arm64/vendor/aarch64-apple-darwin" "$C/account-client"
          cp "$GITHUB_WORKSPACE"/apps/desktop/third-party/codex/{LICENSE,NOTICE} "$C/account-client/"
          SERVICE="$(ls -td "$GITHUB_WORKSPACE"/.local/macos-service/*/dist/NotetakerService | head -1)"
          cp "$GITHUB_WORKSPACE/apps/desktop/third-party/native/python/PYTHON-LICENSE.txt" "$SERVICE/PYTHON-LICENSE.txt"
          SOURCE="GitHub Actions $GITHUB_REPOSITORY@$GITHUB_SHA run $GITHUB_RUN_ID"
          cat > "$C/sources.json" <<EOF
          {"components": {
            "service": {"directory": "$SERVICE", "version": "0.1.0", "source": "$SOURCE; locked uv/Bun dependencies, Python 3.12"},
            "postgres": {"directory": "$C/postgres", "version": "$PG_VERSION", "source": "ftp.postgresql.org source SHA-256 $PG_SHA256; built --without-icu/readline/openssl, loader paths relocated, ad-hoc signed"},
            "seaweed": {"directory": "$C/seaweed", "version": "$WEED_VERSION", "source": "github.com/seaweedfs release darwin_arm64.tar.gz MD5 $WEED_MD5"},
            "ollama": {"directory": "$C/ollama", "version": "$OLLAMA_VERSION", "source": "github.com/ollama release ollama-darwin.tgz SHA-256 $OLLAMA_SHA256"},
            "account-client": {"directory": "$C/account-client", "version": "0.154.0", "source": "Bun frozen lock @openai/codex-darwin-arm64"}
          }}
          EOF
      - name: Stage runtime and build app
        run: |
          set -euo pipefail
          LOCK="$(bun run lock:macos-runtime "$RUNNER_TEMP/nt-components/sources.json" | sed -n 's/.*lock (review provenance before packaging): //p')"
          WEB="$(ls -td .local/desktop-web/*/ | head -1)"
          RUNTIME="$(bun run prepare:macos-runtime "$WEB" "$LOCK" | sed -n 's/^Prepared Mac runtime: //p')"
          bun run build:macos-app "$RUNTIME"
          APP=.local/macos-standalone-dist/mac-arm64/Notetaker.app
          # Ad-hoc signature so Apple Silicon will launch it; not a Developer ID signature.
          codesign --force --deep --sign - "$APP"
          ditto -c -k --keepParent "$APP" "Notetaker-0.1.0-macOS-arm64-unsigned.zip"
          shasum -a 256 Notetaker-0.1.0-macOS-arm64-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Notetaker-macOS-arm64
          path: Notetaker-0.1.0-macOS-arm64-unsigned.zip
      - name: Publish GitHub pre-release on macOS tags
        if: startsWith(github.ref, 'refs/tags/macos-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" Notetaker-0.1.0-macOS-arm64-unsigned.zip --prerelease \
            --title "Notetaker $GITHUB_REF_NAME (macOS Apple Silicon, unsigned test build)" \
            --notes "Unsigned, un-notarized development build for testing. After unzipping and moving to Applications, run: xattr -dr com.apple.quarantine /Applications/Notetaker.app — then open it. Select your own local speech/note models; nothing is downloaded. Use a new standalone library."

name: Electron Windows package

on:
  workflow_dispatch:
  push:
    tags: ['electron-v*']

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.17'
          python-version: '3.12'
      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install Python verification dependencies
        run: |
          uv venv
          uv pip sync apps/api/requirements-dev.lock
      - name: Verify renderer and desktop contracts
        run: |
          bun run test
          bun run typecheck
          bun run lint
          bun run build:web
          bun run test:desktop
      - name: Build Electron installer
        run: bun run build:desktop
      - uses: actions/upload-artifact@v4
        with:
          name: Notetaker-Electron-Windows-x64
          path: .local/desktop-dist/*
      - name: Publish GitHub release on Electron version tags
        if: startsWith(github.ref, 'refs/tags/electron-v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: gh release create "$env:RELEASE_TAG" .local/desktop-dist/*.exe --title "Notetaker $env:RELEASE_TAG" --generate-notes
